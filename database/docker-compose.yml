version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: miailove-postgres
    restart: no
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Anping520
      POSTGRES_DB: miailove
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - miailove-network

  redis:
    image: redis:7-alpine
    container_name: miailove-redis
    restart: no
    command: redis-server --appendonly yes --requirepass Anping520
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - miailove-network

networks:
  miailove-network:
    driver: bridge
