
<!doctype html>
<html lang="zh-CN">
<head><script data-od-sandbox-shim>(function(){
  function makeStore(){
    var data = {};
    var api = {
      getItem: function(k){ return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
      setItem: function(k, v){ data[k] = String(v); },
      removeItem: function(k){ delete data[k]; },
      clear: function(){ data = {}; },
      key: function(i){ return Object.keys(data)[i] || null; }
    };
    Object.defineProperty(api, 'length', { get: function(){ return Object.keys(data).length; } });
    return api;
  }
  function tryShim(name){
    var works = false;
    try { works = !!window[name] && typeof window[name].getItem === 'function'; void window[name].length; }
    catch (_) { works = false; }
    if (works) return;
    try { Object.defineProperty(window, name, { configurable: true, value: makeStore() }); }
    catch (_) { try { window[name] = makeStore(); } catch (__) {} }
  }
  tryShim('localStorage');
  tryShim('sessionStorage');
})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>觅AI｜员工登录</title>
  <style>
    :root {
      --bg:      oklch(98% 0.012 55);
      --surface: oklch(100% 0 0);
      --fg:      oklch(22% 0.028 255);
      --muted:   oklch(50% 0.018 255);
      --border:  oklch(90% 0.016 55);
      --accent:  oklch(63% 0.14 18);
      --accent-soft: oklch(94% 0.04 18);
      --gold: oklch(75% 0.09 78);
      --rose-deep: oklch(42% 0.09 18);
      --ink-soft: oklch(33% 0.025 255);
      --success: oklch(58% 0.12 155);
      --font-display: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 14% 18%, oklch(95% 0.045 18) 0 18rem, transparent 31rem),
        radial-gradient(circle at 86% 12%, oklch(95% 0.035 78) 0 14rem, transparent 28rem),
        linear-gradient(135deg, var(--bg), oklch(96% 0.018 45));
      color: var(--fg);
      font-family: var(--font-body);
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 48px);
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(1180px, 100%);
      min-height: min(760px, calc(100vh - 48px));
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.78fr);
      overflow: hidden;
      border: 1px solid color-mix(in oklch, var(--border), white 25%);
      border-radius: 32px;
      background: color-mix(in oklch, var(--surface), transparent 4%);
      box-shadow: 0 30px 80px color-mix(in oklch, var(--fg), transparent 88%);
    }

    .story {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(32px, 5vw, 64px);
      background:
        linear-gradient(160deg, color-mix(in oklch, var(--surface), transparent 5%), color-mix(in oklch, var(--accent-soft), transparent 18%)),
        radial-gradient(circle at 70% 34%, color-mix(in oklch, var(--accent), transparent 84%), transparent 24rem);
      border-inline-end: 1px solid var(--border);
      isolation: isolate;
    }

    .story::before {
      content: "";
      position: absolute;
      inset: 9%;
      z-index: -1;
      border: 1px solid color-mix(in oklch, var(--accent), transparent 72%);
      border-radius: 999px;
      transform: rotate(-10deg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--ink-soft);
    }

    .mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--rose-deep), var(--accent));
      color: white;
      font-family: var(--font-display);
      font-size: 22px;
      box-shadow: inset 0 1px 0 color-mix(in oklch, white, transparent 65%);
    }

    .brand strong {
      display: block;
      font-size: 20px;
      letter-spacing: 0;
    }

    .brand span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .hero-copy {
      max-width: 670px;
      margin-block: 78px 46px;
    }

    .eyebrow {
      width: fit-content;
      margin: 0 0 18px;
      padding: 8px 12px;
      border: 1px solid color-mix(in oklch, var(--accent), transparent 55%);
      border-radius: 999px;
      background: color-mix(in oklch, var(--accent-soft), white 22%);
      color: var(--rose-deep);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(42px, 6vw, 82px);
      line-height: 1.03;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .deck {
      max-width: 560px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 1.45vw, 21px);
      line-height: 1.75;
      text-wrap: pretty;
    }

    .insight-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .insight {
      min-height: 126px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      border: 1px solid color-mix(in oklch, var(--border), white 15%);
      border-radius: 22px;
      background: color-mix(in oklch, var(--surface), transparent 14%);
    }

    .insight b {
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 26px;
      font-variant-numeric: tabular-nums;
    }

    .insight span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .match-orbit {
      position: absolute;
      inset-inline-end: clamp(22px, 5vw, 72px);
      inset-block-start: 142px;
      width: clamp(180px, 22vw, 280px);
      aspect-ratio: 1;
      border-radius: 50%;
      pointer-events: none;
      opacity: .92;
    }

    .ring {
      position: absolute;
      border: 1px solid color-mix(in oklch, var(--accent), transparent 62%);
      border-radius: 50%;
    }

    .ring.one { inset: 0; }
    .ring.two { inset: 15%; transform: translate(-5%, 6%); border-color: color-mix(in oklch, var(--gold), transparent 42%); }
    .ring.three { inset: 31%; background: color-mix(in oklch, var(--surface), transparent 12%); box-shadow: 0 12px 40px color-mix(in oklch, var(--accent), transparent 86%); }

    .dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 8px color-mix(in oklch, var(--accent), transparent 82%);
    }

    .dot.a { inset-block-start: 12%; inset-inline-start: 20%; }
    .dot.b { inset-block-end: 21%; inset-inline-end: 9%; background: var(--gold); }

    .panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(28px, 4vw, 56px);
      background: color-mix(in oklch, var(--surface), transparent 0%);
    }

    .login-card {
      width: min(430px, 100%);
      margin-inline: auto;
    }

    .login-card h2 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .login-card > p {
      margin: 0 0 30px;
      color: var(--muted);
      line-height: 1.65;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .field {
      display: grid;
      gap: 9px;
      margin-bottom: 18px;
    }

    label {
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 650;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      min-height: 54px;
      padding-inline: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: oklch(99% 0.004 55);
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .input-wrap:focus-within {
      border-color: color-mix(in oklch, var(--accent), white 5%);
      background: white;
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent), transparent 84%);
    }

    .input-wrap svg {
      flex: 0 0 auto;
      margin-inline-end: 11px;
      color: color-mix(in oklch, var(--muted), white 8%);
    }

    input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--fg);
      font-size: 16px;
    }

    input::placeholder { color: color-mix(in oklch, var(--muted), white 22%); }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 8px 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .check input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    a {
      color: var(--rose-deep);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    .primary {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--rose-deep), var(--accent));
      color: white;
      cursor: pointer;
      font-weight: 720;
      box-shadow: 0 18px 38px color-mix(in oklch, var(--accent), transparent 74%);
    }

    .primary:focus-visible {
      outline: 3px solid color-mix(in oklch, var(--accent), white 25%);
      outline-offset: 3px;
    }

    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin: 26px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: var(--border);
    }

    .sso-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .secondary {
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: white;
      color: var(--ink-soft);
      cursor: pointer;
      font-weight: 650;
    }

    .secure-note {
      margin-top: 28px;
      padding: 16px;
      border: 1px solid color-mix(in oklch, var(--border), white 10%);
      border-radius: 18px;
      background: color-mix(in oklch, var(--accent-soft), white 55%);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .secure-note strong {
      display: block;
      margin-bottom: 3px;
      color: var(--fg);
      font-size: 14px;
    }

    @media (max-width: 920px) {
      body { padding: 16px; place-items: start center; }

      .shell {
        grid-template-columns: 1fr;
        min-height: 0;
        border-radius: 26px;
      }

      .story {
        min-height: 470px;
        border-inline-end: 0;
        border-block-end: 1px solid var(--border);
      }

      .hero-copy { margin-block: 54px 34px; }
      .match-orbit { opacity: .34; inset-block-start: 112px; }
    }

    @media (max-width: 620px) {
      body { padding: 0; background: var(--surface); }

      .shell {
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .story,
      .panel {
        padding: 26px 20px;
      }

      .story {
        min-height: auto;
      }

      .hero-copy {
        margin-block: 42px 28px;
      }

      h1 {
        font-size: 42px;
      }

      .insight-grid {
        grid-template-columns: 1fr;
      }

      .insight {
        min-height: 92px;
      }

      .match-orbit {
        display: none;
      }

      .panel {
        justify-content: start;
      }

      .sso-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="觅AI员工登录页">
    <section class="story" aria-labelledby="welcome-title">
      <div>
        <div class="brand" aria-label="觅AI">
          <div class="mark" aria-hidden="true">觅</div>
          <div>
            <strong>觅AI</strong>
            <span>高端婚恋会员运营系统</span>
          </div>
        </div>

        <div class="hero-copy">
          <p class="eyebrow">STAFF PORTAL · MEMBER CARE</p>
          <h1 id="welcome-title">把每一次相遇，交给更专业的服务流程。</h1>
          <p class="deck">登录后进入会员画像、匹配线索、红娘跟进与实名认证工作台。为高端婚恋会员提供更稳妥、更有温度的顾问协作体验。</p>
        </div>
      </div>

      <div class="match-orbit" aria-hidden="true">
        <span class="ring one"></span>
        <span class="ring two"></span>
        <span class="ring three"></span>
        <span class="dot a"></span>
        <span class="dot b"></span>
      </div>

      <div class="insight-grid" aria-label="今日运营概览">
        <div class="insight">
          <b>128</b>
          <span>待跟进高意向会员</span>
        </div>
        <div class="insight">
          <b>36</b>
          <span>今日匹配建议已生成</span>
        </div>
        <div class="insight">
          <b>98%</b>
          <span>实名资料完整率</span>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="login-title">
      <div class="login-card">
        <h2 id="login-title">员工登录</h2>
        <p>使用公司账号进入觅AI后台，继续处理会员档案、约见安排与红娘协作任务。</p>

        <div class="status-row" aria-label="系统状态">
          <span class="status">会员资料库正常</span>
          <span class="status">AI 匹配引擎在线</span>
        </div>

        <form>
          <div class="field">
            <label for="account">员工账号</label>
            <div class="input-wrap">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" stroke="currentColor" stroke-width="1.8"/>
              </svg>
              <input id="account" name="account" autocomplete="username" placeholder="请输入员工编号 / 手机号">
            </div>
          </div>

          <div class="field">
            <label for="password">登录密码</label>
            <div class="input-wrap">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M6.5 10h11A2.5 2.5 0 0 1 20 12.5v6A2.5 2.5 0 0 1 17.5 21h-11A2.5 2.5 0 0 1 4 18.5v-6A2.5 2.5 0 0 1 6.5 10Z" stroke="currentColor" stroke-width="1.8"/>
                <path d="M12 15v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
            </div>
          </div>

          <div class="row">
            <label class="check">
              <input type="checkbox" name="remember">
              <span>记住本设备</span>
            </label>
            <a href="#">忘记密码？</a>
          </div>

          <button class="primary" type="submit">进入员工工作台</button>
        </form>

        <div class="divider">或使用安全方式登录</div>

        <div class="sso-grid">
          <button class="secondary" type="button">企业微信</button>
          <button class="secondary" type="button">短信验证码</button>
        </div>

        <div class="secure-note">
          <strong>会员隐私保护已启用</strong>
          登录行为将记录到安全审计。请仅在授权设备上查看会员身份、资产与择偶偏好等敏感资料。
        </div>
      </div>
    </section>
  </main>
</body>
</html>
